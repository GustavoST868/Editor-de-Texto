<!DOCTYPE html>
<html lang="pt-BR" data-theme="dusk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escrita — editor com IA</title>
    <meta name="description" content="Editor minimalista com revisão inteligente via Ollama.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist+Mono:wght@300;400;500&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Fragment+Mono:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Syne+Mono&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">

        <!-- ─── Topbar ─────────────────────────────────────────────── -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo">
                    <span class="logo-mark">✎</span>
                    <span class="logo-text">escrita</span>
                </div>
                <div class="topbar-sep"></div>
                <span class="file-badge">
                    <i class="fa-regular fa-file-lines"></i>
                    rascunho.md
                </span>
            </div>

            <div class="topbar-center">
                <!-- Modelo -->
                <div class="tool-group">
                    <i class="fa-solid fa-microchip"></i>
                    <select id="model-select"></select>
                    <button id="refresh-models" class="icon-btn" title="Recarregar modelos">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>

                <div class="tool-sep"></div>

                <!-- Preset -->
                <div class="tool-group">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <select id="preset-select">
                        <option value="default">Padrão</option>
                        <option value="formal">Formal</option>
                        <option value="informal">Casual</option>
                        <option value="correct">Correção</option>
                        <option value="creative">Criativo</option>
                    </select>
                </div>

                <div class="tool-sep"></div>

                <!-- Temperatura -->
                <div class="tool-group temp">
                    <i class="fa-solid fa-fire-flame-curved"></i>
                    <input type="range" id="temperature" min="0.1" max="1.2" step="0.05" value="0.7">
                    <span id="temp-val">0.7</span>
                </div>
            </div>

            <div class="topbar-right">
                <!-- Temas -->
                <span class="theme-label">tema</span>
                <div class="theme-picker">
                    <button class="theme-btn active" data-theme="dusk"  title="Dusk — pergaminho"></button>
                    <button class="theme-btn"        data-theme="noir"  title="Noir — carvão"></button>
                    <button class="theme-btn"        data-theme="stone" title="Stone — cinza editorial"></button>
                    <button class="theme-btn"        data-theme="moss"  title="Moss — floresta"></button>
                    <button class="theme-btn"        data-theme="chalk" title="Chalk — branco limpo"></button>
                    <button class="theme-btn"        data-theme="sepia" title="Sepia — âmbar profundo"></button>
                </div>

                <div class="tool-sep"></div>

                <!-- Fontes -->
                <div class="font-picker">
                    <button class="font-btn active" data-font="serif"     title="Serifada clássica" style="font-family: 'EB Garamond', serif;">A</button>
                    <button class="font-btn"        data-font="modern"    title="Serifada moderna"  style="font-family: 'Playfair Display', serif;">A</button>
                    <button class="font-btn"        data-font="editorial" title="Editorial elegante" style="font-family: 'Lora', serif;">A</button>
                    <button class="font-btn"        data-font="mono"      title="Monoespaçada"      style="font-family: 'DM Mono', monospace;">A</button>
                </div>

                <div class="tool-sep"></div>

                <!-- Status conexão -->
                <div class="conn-status">
                    <span class="dot" id="connection-dot"></span>
                    <span id="connection-status">Ollama</span>
                </div>

                <!-- Configurações -->
                <button id="btn-settings" class="icon-btn" title="Configurações">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <!-- ─── Drawer de configurações ────────────────────────────── -->
        <div class="drawer" id="settings-drawer">
            <div class="drawer-inner">
                <div class="drawer-col">
                    <label><i class="fa-regular fa-message"></i> Prompt do sistema</label>
                    <textarea id="prompt-template" placeholder="Prompt usado para revisar o texto..." rows="5"></textarea>
                    <small>Use <code>{text}</code> como placeholder para o trecho selecionado.</small>
                </div>
                <div class="drawer-col">
                    <label><i class="fa-regular fa-lightbulb"></i> Como usar</label>
                    <div class="example">[seu texto aqui]</div>
                    <small>Envolva qualquer trecho com <code>[</code> e <code>]</code>. A IA reescreve automaticamente ao fechar o colchete.</small>
                </div>
                <div class="drawer-col">
                    <div class="history-header">
                        <label><i class="fa-regular fa-clock"></i> Histórico de revisões</label>
                        <button id="clear-history" class="icon-btn" title="Limpar histórico">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                    <div class="history-list" id="history-list">
                        <div class="history-empty">Nenhuma revisão ainda.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── Editor ─────────────────────────────────────────────── -->
        <main class="editor-main">
            <div class="editor-container">
                <div class="line-numbers" id="line-numbers">
                    <div>1</div>
                </div>
                <textarea
                    id="editor"
                    autofocus
                    spellcheck="false"
                    placeholder="Digite ou cole seu texto…&#10;&#10;Para revisar, envolva o trecho com colchetes:&#10;[Este é o texto que quero melhorar com IA]"
                ></textarea>
            </div>

            <footer class="editor-footer">
                <div class="footer-left">
                    <span class="status-light idle" id="action-indicator-light"></span>
                    <span id="action-status">Pronto</span>
                </div>
                <div class="footer-right">
                    <!-- Tamanho da fonte -->
                    <div class="font-size-controls">
                        <button class="size-btn" id="font-decrease" title="Diminuir fonte">−</button>
                        <span class="font-size-label" id="font-size-label">20</span>
                        <button class="size-btn" id="font-increase" title="Aumentar fonte">+</button>
                    </div>
                    <span class="sep"></span>
                    <button id="btn-copy"  class="text-btn"><i class="fa-regular fa-copy"></i> Copiar</button>
                    <button id="btn-clear" class="text-btn danger"><i class="fa-regular fa-trash-can"></i> Limpar</button>
                    <span class="sep"></span>
                    <span id="word-count">0 palavras</span>
                    <span class="sep"></span>
                    <span id="char-count">0 caracteres</span>
                </div>
            </footer>
        </main>
    </div>

    <!-- ─── Modal de comparação ───────────────────────────────── -->
    <div class="modal" id="history-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2><i class="fa-regular fa-code-compare"></i> Comparar revisão</h2>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="diff-pane">
                    <div class="diff-col original">
                        <h3><i class="fa-regular fa-rectangle-xmark"></i> Original</h3>
                        <div class="diff-text" id="modal-original-text"></div>
                    </div>
                    <div class="diff-col revised">
                        <h3><i class="fa-regular fa-rectangle-check"></i> Revisado</h3>
                        <div class="diff-text" id="modal-revised-text"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-btn-restore" class="btn-primary">
                    <i class="fa-regular fa-rotate-left"></i> Restaurar original
                </button>
                <button id="modal-btn-copy" class="btn-secondary">
                    <i class="fa-regular fa-copy"></i> Copiar revisado
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
