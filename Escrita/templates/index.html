<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escrita</title>
    <meta name="description" content="Editor de texto minimalista com revisão inteligente por IA via Ollama.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app-container">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo">

                </div>
                <span class="topbar-sep"></span>
                <span class="file-tag"><i class="fa-regular fa-file-lines"></i> documento.txt</span>
            </div>
            <div class="topbar-center">
                <div class="toolbar-group">
                    <label for="model-select" class="toolbar-label"><i class="fa-solid fa-microchip"></i></label>
                    <select id="model-select">
                        <option value="">Carregando...</option>
                    </select>
                    <button id="refresh-models" class="toolbar-btn" title="Recarregar modelos"><i
                            class="fa-solid fa-arrows-rotate"></i></button>
                </div>
                <span class="topbar-sep"></span>
                <div class="toolbar-group">
                    <label for="preset-select" class="toolbar-label"><i
                            class="fa-solid fa-wand-magic-sparkles"></i></label>
                    <select id="preset-select">
                        <option value="default">Padrão</option>
                        <option value="formal">Formal</option>
                        <option value="informal">Casual</option>
                        <option value="correct">Correção</option>
                        <option value="creative">Criativo</option>
                    </select>
                </div>
                <span class="topbar-sep"></span>
                <div class="toolbar-group temp-group">
                    <label for="temperature" class="toolbar-label"><i class="fa-solid fa-fire-flame-curved"></i></label>
                    <input type="range" id="temperature" min="0.1" max="1.2" step="0.05" value="0.7">
                    <span class="temp-badge" id="temp-val">0.7</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="connection-badge" id="status-badge">
                    <span class="status-dot disconnected" id="connection-dot"></span>
                    <span class="status-text" id="connection-status">Ollama</span>
                </div>
                <button id="btn-settings" class="toolbar-btn" title="Configurações"><i
                        class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <!-- Settings Drawer (hidden by default) -->
        <div class="settings-drawer" id="settings-drawer">
            <div class="drawer-content">
                <div class="drawer-section">
                    <label><i class="fa-solid fa-terminal"></i> Prompt do Sistema</label>
                    <textarea id="prompt-template" placeholder="Prompt usado para revisar o texto..."></textarea>
                    <span class="prompt-hint">Use <code>{text}</code> como placeholder para o trecho.</span>
                </div>
                <div class="drawer-section">
                    <label><i class="fa-solid fa-sparkles"></i> Como usar</label>
                    <div class="code-example"><code>***seu texto aqui***</code></div>
                    <span class="prompt-hint">Envolva o trecho com <code>***</code> e a IA reescreve
                        automaticamente.</span>
                </div>
                <div class="drawer-section">
                    <div class="history-header">
                        <label><i class="fa-solid fa-clock-rotate-left"></i> Histórico</label>
                        <button id="clear-history" class="btn-icon-sm" title="Limpar"><i
                                class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="history-list" id="history-list">
                        <div class="history-empty">Nenhuma revisão feita ainda.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Editor -->
        <main class="editor-area">
            <div class="editor-workspace">
                <div class="line-numbers-container" id="line-numbers">
                    <div>1</div>
                </div>
                <textarea id="editor" autofocus placeholder="" spellcheck="false"></textarea>
            </div>
            <footer class="editor-footer">
                <div class="footer-left">
                    <span class="status-indicator-light" id="action-indicator-light"></span>
                    <span id="action-status">Pronto</span>
                </div>
                <div class="footer-right">
                    <button id="btn-copy" class="footer-btn" title="Copiar tudo"><i class="fa-regular fa-copy"></i>
                        Copiar</button>
                    <button id="btn-clear" class="footer-btn danger" title="Limpar"><i
                            class="fa-regular fa-trash-can"></i> Limpar</button>
                    <span class="footer-sep"></span>
                    <span id="word-count">0 palavras</span>
                    <span class="footer-sep"></span>
                    <span id="char-count">0 caracteres</span>
                </div>
            </footer>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-backdrop" id="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-code-compare"></i> Comparação</h2>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="diff-container">
                    <div class="diff-box original">
                        <h3><i class="fa-solid fa-minus-circle"></i> Original</h3>
                        <div class="diff-text-content" id="modal-original-text"></div>
                    </div>
                    <div class="diff-box revised">
                        <h3><i class="fa-solid fa-plus-circle"></i> Revisado</h3>
                        <div class="diff-text-content" id="modal-revised-text"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-btn-restore" class="modal-btn primary"><i class="fa-solid fa-rotate-left"></i>
                    Restaurar</button>
                <button id="modal-btn-copy" class="modal-btn secondary"><i class="fa-regular fa-copy"></i> Copiar
                    Revisado</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
