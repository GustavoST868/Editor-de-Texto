<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escrita — editor com IA</title>
    <meta name="description" content="Editor minimalista com revisão inteligente via Ollama.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <!-- Barra superior -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo">
                    <span class="logo-mark">✎</span>
                    <span class="logo-text">escrita</span>
                </div>
                <div class="topbar-sep"></div>
                <span class="file-badge"><i class="fa-regular fa-file-lines"></i> rascunho.md</span>
            </div>

            <div class="topbar-center">
                <div class="tool-group">
                    <i class="fa-solid fa-microchip"></i>
                    <select id="model-select"></select>
                    <button id="refresh-models" class="icon-btn" title="Recarregar modelos">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>

                <div class="tool-sep"></div>

                <div class="tool-group">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <select id="preset-select">
                        <option value="default">Padrão</option>
                        <option value="formal">Formal</option>
                        <option value="informal">Casual</option>
                        <option value="correct">Correção</option>
                        <option value="creative">Criativo</option>
                    </select>
                </div>

                <div class="tool-sep"></div>

                <div class="tool-group temp">
                    <i class="fa-solid fa-fire-flame-curved"></i>
                    <input type="range" id="temperature" min="0.1" max="1.2" step="0.05" value="0.7">
                    <span id="temp-val">0.7</span>
                </div>
            </div>

            <div class="topbar-right">
                <div class="conn-status">
                    <span class="dot" id="connection-dot"></span>
                    <span id="connection-status">Ollama</span>
                </div>
                <button id="btn-settings" class="icon-btn" title="Configurações">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <!-- Painel de configurações (drawer) -->
        <div class="drawer" id="settings-drawer">
            <div class="drawer-inner">
                <div class="drawer-col">
                    <label><i class="fa-regular fa-message"></i> Prompt do sistema</label>
                    <textarea id="prompt-template" placeholder="Prompt usado para revisar o texto..."></textarea>
                    <small>Use <code>{text}</code> como placeholder para o trecho selecionado.</small>
                </div>
                <div class="drawer-col">
                    <label><i class="fa-regular fa-lightbulb"></i> Como usar</label>
                    <div class="example">[seu texto aqui]</div>
                    <small>Envolva qualquer trecho com <code>[</code> e <code>]</code>. A IA reescreve automaticamente.</small>
                </div>
                <div class="drawer-col">
                    <div class="history-header">
                        <label><i class="fa-regular fa-clock"></i> Histórico</label>
                        <button id="clear-history" class="icon-btn tiny" title="Limpar histórico">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                    <div class="history-list" id="history-list">
                        <div class="history-empty">Nenhuma revisão ainda.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Área principal do editor -->
        <main class="editor-main">
            <div class="editor-container">
                <div class="line-numbers" id="line-numbers">
                    <div>1</div>
                </div>
                <textarea id="editor" autofocus spellcheck="false" placeholder="Digite ou cole seu texto…&#10;&#10;Para revisar, envolva o trecho com colchetes, ex: &#10;[Este é o texto que quero melhorar]"></textarea>
            </div>

            <footer class="editor-footer">
                <div class="footer-left">
                    <span class="status-light" id="action-indicator-light"></span>
                    <span id="action-status">Pronto</span>
                </div>
                <div class="footer-right">
                    <button id="btn-copy" class="text-btn"><i class="fa-regular fa-copy"></i> Copiar</button>
                    <button id="btn-clear" class="text-btn danger"><i class="fa-regular fa-trash-can"></i> Limpar</button>
                    <span class="sep"></span>
                    <span id="word-count">0 palavras</span>
                    <span class="sep"></span>
                    <span id="char-count">0 caracteres</span>
                </div>
            </footer>
        </main>
    </div>

    <!-- Modal de comparação -->
    <div class="modal" id="history-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2><i class="fa-regular fa-code-compare"></i> Comparar revisão</h2>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="diff-pane">
                    <div class="diff-col original">
                        <h3><i class="fa-regular fa-rectangle-xmark"></i> Original</h3>
                        <div class="diff-text" id="modal-original-text"></div>
                    </div>
                    <div class="diff-col revised">
                        <h3><i class="fa-regular fa-rectangle-check"></i> Revisado</h3>
                        <div class="diff-text" id="modal-revised-text"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-btn-restore" class="btn-primary"><i class="fa-regular fa-undo"></i> Restaurar original</button>
                <button id="modal-btn-copy" class="btn-secondary"><i class="fa-regular fa-copy"></i> Copiar revisado</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
